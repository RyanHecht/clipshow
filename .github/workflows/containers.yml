name: Containers

# Builds and publishes the images to GitHub's container registry:
#   ghcr.io/<owner>/clipshow                 web app            :latest, :<version>
#   ghcr.io/<owner>/clipshow-worker          indexing worker    :cpu, :cuda, :rocm, :<version>-<flavor>
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: clipshow,        target: web,    torch: cpu,  latest: latest, suffix: "" }
          - { image: clipshow-worker, target: worker, torch: cpu,  latest: cpu,    suffix: "-cpu" }
          - { image: clipshow-worker, target: worker, torch: cuda, latest: cuda,   suffix: "-cuda" }
          - { image: clipshow-worker, target: worker, torch: rocm, latest: rocm,   suffix: "-rocm" }
    steps:
      - uses: actions/checkout@v4

      - name: Make room for GPU builds
        if: matrix.torch != 'cpu'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ref }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.latest }},enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: TORCH=${{ matrix.torch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.torch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.torch }}
