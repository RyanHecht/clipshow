[project]
name = "clipshow"
version = "0.1.0"
description = "Turn your media library into a meme machine: search your Jellyfin shows and grab reaction GIFs, clips, and stills."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ryan Hecht" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pysrt>=1.1",
    "opencv-python-headless>=4.9",
    "sentence-transformers>=3.0",
    "transformers>=4.45",
    "numpy>=2.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sentencepiece>=0.2",
    "protobuf>=5.0",
    "silero-vad>=6.2.3",
]

[project.scripts]
clipshow = "clipshow.cli:app"
clipshow-web = "clipshow.web.__main__:main"
clipshow-worker = "clipshow.worker:main"

# PyTorch comes in one flavour per kind of hardware; pick one when installing:
#   uv sync --extra cpu     (no GPU; also what the web image uses)
#   uv sync --extra cuda    (NVIDIA)
#   uv sync --extra rocm    (AMD)
[project.optional-dependencies]
cpu = ["torch>=2.5"]
cuda = ["torch>=2.5"]
rocm = ["torch>=2.5", "triton-rocm; sys_platform == 'linux'"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
